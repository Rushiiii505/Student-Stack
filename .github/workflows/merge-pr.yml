name: Merge PR
on:
workflow_dispatch:
inputs:
pr_number:
description: 'PR number to merge'
required: true
default: '6'
jobs:
merge:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Merge PR
run: |
gh pr merge ${{ github.event.inputs.pr_number }} --merge --admin
env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
